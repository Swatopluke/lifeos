# scripts — Hermes Orchestration Protocol config
# Repo-level truth: gates, exclusions, one-way doors, skill defaults, routing.
# Fleet-wide ceilings live in ~/.hermes/config.yml and CANNOT be raised here.

# Stack: vanilla-js-spa (detected by /hermes-init)

# Gates are run by `hermes-gates`, which executes each one in this directory and
# reports the real exit code. They are not advisory text.
#
# History worth keeping: `build` and `lint` used to be `node --check js/*.js`,
# which silently checked only js/app.js — node --check reads one file and
# ignores the rest of argv. `test` was `... && false`, a gate that could never
# pass, so every run that claimed "gates green" had quietly skipped it.
gates:
  # One file per invocation, because node --check ignores extra arguments.
  build: |
    find js scripts tests \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
  # Run twice. The bugs this suite exists to catch are timezone bugs, and they
  # are all invisible when the host clock is set to Europe/Budapest.
  test: |
    TZ=UTC node --test tests/*.test.mjs && TZ=America/Los_Angeles node --test tests/*.test.mjs
  # Enforces the Budapest-bucketing rule that AGENTS.md states and that three
  # modules had drifted away from.
  lint: |
    node scripts/check-tz.mjs
  # Structural: section count, asset/module resolution, every drawn chart has a
  # canvas, every named import is really exported.
  smoke: |
    node scripts/smoke.mjs
  # The knowledge graph must still describe the code. Structural drift only —
  # the commit stamp moves every commit and gating on it would train everyone
  # to ignore a permanently-red gate.
  graph: |
    python3 .understand-anything/gen_graph.py --check

do_not_touch:
  - AGENTS.md
  - CLAUDE.md
  - .hermes/config.yml
  - .env
  - .env.*
  - "**/secrets/**"
  - "**/migrations/**"
  - ".github/workflows/**"

one_way_doors:
  - description: "Schema changes (tables, columns, migrations)"
    reason: "irreversible without data migration"
  - description: "Public API changes"
    reason: "breaks external consumers"

skill_defaults:
  source_edit:     []
  test_touch:      []
  review:          [requesting-code-review]
  graph_refresh:   [understand]

auto_approve:
  - "dependency bumps within minor version"
  - "test additions or corrections"
  - "documentation-only changes"
  - "dead code removal"
  - "lint fixups"

execution_routing:
  self:
    max_files: 3
    max_transitive_nodes: 15
    max_complexity: S
    one_way_door: false
  kimi:
    min_complexity: M
    handoff_format: json
  judgment:
    triggers: [planning, adr, state_regeneration, terminology,
               architecture, one_way_door, third_failure, ambiguity_with_kimi]
